name: HY B01 B02 B03 profit-oriented entry-exit research
on:
  push:
    branches: [test/b-entry-exit-20261119]
    paths:
      - 'experiments/hy_b_entry_exit.py'
      - '.github/workflows/hy-b-entry-exit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2.0,<3' requests
      - name: Run B01 B02 B03 historical comparison
        run: python -u experiments/hy_b_entry_exit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hy-b-entry-exit-test-results
          path: experiments/hy_b_entry_exit_results.json
          if-no-files-found: ignore
