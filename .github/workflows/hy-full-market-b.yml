name: HY B whole current KOSPI KOSDAQ 5y study
on:
  push:
    branches: [test/full-market-b-20261119]
    paths:
      - 'experiments/hy_full_market_b.py'
      - '.github/workflows/hy-full-market-b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2.0,<3' 'requests>=2.31'
      - name: Execute full current-universe historical study
        run: python -u experiments/hy_full_market_b.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hy-full-market-b-results
          path: experiments/full_market_b_result.json
          if-no-files-found: ignore
