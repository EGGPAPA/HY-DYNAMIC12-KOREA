name: SK Hynix Kakao Price Alert

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:
    inputs:
      send_test_message:
        description: '카카오 테스트 메시지 강제 전송'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load Kakao refresh token
        shell: bash
        env:
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FALLBACK_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f .kakao_refresh_token.enc ]; then
            TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 \
              -in .kakao_refresh_token.enc \
              -pass env:KAKAO_CLIENT_SECRET)
            echo "::add-mask::$TOKEN"
            echo "KAKAO_REFRESH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo 'Loaded encrypted Kakao refresh token.'
          else
            echo "::add-mask::$FALLBACK_REFRESH_TOKEN"
            echo "KAKAO_REFRESH_TOKEN=$FALLBACK_REFRESH_TOKEN" >> "$GITHUB_ENV"
            echo 'Encrypted token not found; using repository secret.'
          fi

      - name: Check price and send Kakao alert
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_message && 'true' || 'false' }}
        run: python price_alert.py

      - name: Save alert state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_message) }}
        run: |
          if [ -f price_alert_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add price_alert_state.json
            git diff --cached --quiet || git commit -m 'Update SK Hynix price alert state'
            git push
          fi
