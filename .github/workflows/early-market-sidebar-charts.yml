name: Early-market sidebar and charts validation

on:
  push:
    branches: [feature/early-market-sidebar-charts-20261120]
    paths:
      - 'early_market_charts.py'
      - 'early_market_dashboard.py'
      - 'early_market_ui.py'
      - 'nav_labels.py'
      - 'rise_timing_watchlist_ui.py'
      - 'pages/5_전시장_선행탐지.py'
      - 'tests/test_early_market_charts.py'
      - '.github/workflows/early-market-sidebar-charts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidebar-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart/test dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'streamlit==1.50.0' 'altair>=5,<6' 'requests>=2.31' 'numpy>=2,<3' 'yfinance>=0.2.40'
      - name: Syntax check
        run: python -m py_compile early_market_charts.py early_market_dashboard.py early_market_ui.py nav_labels.py rise_timing_watchlist_ui.py pages/5_전시장_선행탐지.py
      - name: Test chart parity and sidebar navigation
        run: python -m unittest discover -s tests -p test_early_market_charts.py -v
      - name: Confirm existing early detector rules unchanged
        run: python -m unittest discover -s tests -p test_early_market_detector.py -v
      - name: Test dashboard chart construction without side effects
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from datetime import date, timedelta
          from early_market_charts import chart_rows
          from early_market_dashboard import show_charts
          rows=[]
          base=date(2026, 6, 1)
          for i in range(100):
              close=12000+20*i
              rows.append({"date":(base+timedelta(days=i)).isoformat(),
                           "open":float(close-10),"high":float(close+50),
                           "low":float(close-50),"close":float(close),"volume":float(400000+i*100)})
          with patch("early_market_dashboard.st.altair_chart") as charts:
              show_charts(chart_rows(rows), 63)
          assert charts.call_count == 4, charts.call_count
          print("SIDEBAR_CHARTS_OK four chart views constructed")
          PY
      - name: Read-only live chart feed smoke test
        run: |
          python - <<'PY'
          from early_market_charts import get_naver_chart_rows
          rows=get_naver_chart_rows("090430","2026-11-19",100)
          assert len(rows) >= 85 and rows[-1]["date"] == "2026-11-19"
          assert 0 <= rows[-1]["rsi14"] <= 100
          print("EARLY_LIVE_CHART_OK", rows[-1]["date"], "bars", len(rows), "RSI", round(rows[-1]["rsi14"],2))
          PY
