name: Holdings reference alerts

on:
  schedule:
    - cron: '7,17,27,37,47,57 0-5 * * 1-5'
    - cron: '7,17,27,37 6 * * 1-5'
  push:
    paths:
      - 'scripts/monitor_holdings.py'
      - '.github/workflows/holdings-reference-alert.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holdings-reference-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests yfinance
      - name: Load Kakao refresh token
        shell: bash
        env:
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FALLBACK_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f .kakao_refresh_token.enc ]; then
            TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 \
              -in .kakao_refresh_token.enc \
              -pass env:KAKAO_CLIENT_SECRET)
            echo "::add-mask::$TOKEN"
            echo "KAKAO_REFRESH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo 'Loaded encrypted Kakao refresh token.'
          else
            echo "::add-mask::$FALLBACK_REFRESH_TOKEN"
            echo "KAKAO_REFRESH_TOKEN=$FALLBACK_REFRESH_TOKEN" >> "$GITHUB_ENV"
            echo 'Encrypted token not found; using repository secret.'
          fi


      - name: Check holdings and notify
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          HOLDING_TEST: ${{ github.event_name != 'schedule' && 'true' || 'false' }}
        run: python scripts/monitor_holdings.py
      - name: Persist sent alerts
        if: always()
        run: |
          if [ ! -f data/holding_price_alert_state.json ]; then exit 0; fi
          git add data/holding_price_alert_state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save holdings alert state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
