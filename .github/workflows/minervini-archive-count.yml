name: Count independent 2026 public Minervini archive

on:
  push:
    branches:
      - feature/minervini-independent-trend-screen
    paths:
      - .github/workflows/minervini-archive-count.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Count distinct tickers in dated public 2026 posts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/count_public_minervini_archive.py --year 2026 --through 2026-11-20 --output public_minervini_2026_ytd.json
      - name: Count unique qualifiers over trailing 12 months
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/count_public_minervini_archive.py --since 2025-11-21 --through 2026-11-20 --output public_minervini_trailing_12m.json
      - name: Upload reproducible annual counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-minervini-2026-ytd
          path: |
            public_minervini_2026_ytd.json
            public_minervini_trailing_12m.json
          if-no-files-found: ignore
