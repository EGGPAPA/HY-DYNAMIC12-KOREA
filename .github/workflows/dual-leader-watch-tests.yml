name: Dual leader watch validation
on:
  push:
    branches:
      - feature/dual-leader-watch-20261021
  pull_request:
    paths:
      - dual_leader_watch.py
      - rise_current_price_ui.py
      - test_dual_leader_watch.py
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3'
      - run: python -m py_compile dual_leader_watch.py rise_current_price_ui.py
      - run: python -m unittest test_dual_leader_watch test_watchlist_top20 test_current_price_analysis -v
