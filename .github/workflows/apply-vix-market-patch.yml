name: Apply VIX market patch

on:
  push:
    branches:
      - add-vix-market-risk-summary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-vix-market-risk-summary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply_vix_market_patch.py
      - name: Commit integrated file
        run: |
          if git diff --quiet -- market_environment.py; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_environment.py
          git commit -m "Integrate VIX global risk summary"
          git push origin HEAD:add-vix-market-risk-summary
