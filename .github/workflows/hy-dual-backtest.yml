name: HY 1an EOD proxy research backtest
on:
  push:
    branches: [test/dual-signal-20261119]
    paths:
      - 'experiments/hy_dual_backtest.py'
      - '.github/workflows/hy-dual-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-eod-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pandas numpy requests
      - name: Run historical daily data replay
        run: python experiments/hy_dual_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hy-dual-signal-proxy-result
          path: experiments/hy_dual_backtest_result.json
          if-no-files-found: ignore
