name: Pension multiple ETF records

on:
  push:
    branches: [main]
    paths:
      - 'pension_transactions.py'
      - 'pension_manager_ui.py'
      - 'tests/test_pension_*.py'
      - 'tests/fixtures/pension_app.py'
      - '.github/workflows/pension-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'streamlit==1.50.0' 'pandas>=2.2,<3' requests
      - run: python -m unittest discover -s tests -p 'test_pension_*.py' -v
      - run: python -m py_compile pension_transactions.py pension_manager_ui.py
