name: Current price and holiday reference tests

on:
  push:
    branches: [main]
    paths:
      - 'rise_live_analysis.py'
      - 'rise_live_data.py'
      - 'rise_current_price_ui.py'
      - 'test_current_price_analysis.py'
      - 'test_holiday_reference.py'
      - 'watch_sector_context.py'
      - 'watch_leader_comparison_ui.py'
      - 'rise_watch_cohort.py'
      - 'rise_timing_watchlist_ui.py'
      - 'test_watch_sector_context.py'
      - '.github/workflows/current-price-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3'
      - run: python -m unittest test_current_price_analysis test_holiday_reference test_watch_sector_context -v
      - run: python -m py_compile watch_sector_context.py watch_leader_comparison_ui.py rise_timing_watchlist_ui.py rise_watch_cohort.py


