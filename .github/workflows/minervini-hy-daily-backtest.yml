name: HY Minervini daily proxy study

on:
  push:
    branches:
      - experiment/minervini-hy-daily-proxy-backtest
    paths:
      - .github/workflows/minervini-hy-daily-backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install daily research dependencies
        run: python -m pip install 'pandas>=2.0'
      - name: Execute offline regression checks
        run: python -m unittest discover -s tests -p 'test_minervini_hy_daily_proxy.py' -v
      - name: Historical study on dated Minervini lists, with HY close proxy
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: python scripts/backtest_minervini_hy_daily_proxy.py --start 2026-08-03 --end 2026-11-20 --workers 6 --output minervini_hy_daily_proxy_result.json
      - name: Upload auditable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minervini-hy-daily-proxy-2026
          path: minervini_hy_daily_proxy_result.json
          if-no-files-found: ignore
          retention-days: 14
