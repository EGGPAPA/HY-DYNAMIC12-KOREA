name: Separate leader investment project
on:
  push:
    branches: [main]
    paths:
      - 'projects/leader_investment/**'
      - 'rise_timing_watchlist_ui.py'
      - 'rise_live_analysis.py'
      - 'rise_leaders.py'
      - 'watch_sector_context.py'
      - '.github/workflows/strategy-project-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'streamlit==1.50.0' requests pandas
      - run: python -m unittest projects.leader_investment.test_strategy_projects projects.leader_investment.test_strategy_project_store projects.leader_investment.test_separation -v
      - run: python -m unittest discover -s projects/leader_investment/tests -p 'test_strategy_projects_ui.py' -v
      - run: python -m py_compile projects/leader_investment/app.py projects/leader_investment/strategy_projects.py projects/leader_investment/strategy_project_store.py projects/leader_investment/strategy_projects_ui.py rise_timing_watchlist_ui.py
