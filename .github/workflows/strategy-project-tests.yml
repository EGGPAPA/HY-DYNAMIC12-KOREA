name: Short and medium strategy projects
on:
  push:
    branches: [main]
    paths:
      - 'strategy_projects*.py'
      - 'strategy_project_store.py'
      - 'rise_timing_watchlist_ui.py'
      - 'test_strategy*.py'
      - 'tests/test_strategy_projects_ui.py'
      - 'tests/fixtures/strategy_app.py'
      - '.github/workflows/strategy-project-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'streamlit==1.50.0' requests pandas
      - run: python -m unittest test_strategy_projects test_strategy_project_store -v
      - run: python -m unittest discover -s tests -p 'test_strategy_projects_ui.py' -v
      - run: python -m py_compile strategy_projects.py strategy_project_store.py strategy_projects_ui.py rise_timing_watchlist_ui.py
