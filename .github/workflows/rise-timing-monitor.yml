name: Rise timing KIS A+B monitor

on:
  schedule:
    # Off the busiest minute marks. Scheduled Actions can still be delayed.
    - cron: "7,22,37,52 0-5 * * 1-5"
    - cron: "7,22 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run outside Korean market hours for testing"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Read and evaluate only; no messages or remote state writes"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: rise-timing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      FORCE_RUN: ${{ inputs.force_run || 'false' }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install monitor dependencies
        run: pip install "pandas>=2.2,<3" "streamlit==1.50.0" "yfinance>=0.2.40" "requests>=2.31"
      - name: Monitor personal rise-timing watchlist
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/monitor_rise_watchlist.py --dry-run
          else
            python scripts/monitor_rise_watchlist.py
          fi

