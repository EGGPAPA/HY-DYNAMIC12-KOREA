name: Minervini 5-8 condition 3m-6m forward study

on:
  push:
    branches:
      - experiment/hy-minervini-5to8-forward-study-2026
    paths:
      - .github/workflows/minervini-5to8-forward.yml
      - scripts/backtest_minervini_5to8_forward.py
      - tests/test_minervini_5to8_forward.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-study:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install 'pandas>=2.0' 'requests>=2.31' 'streamlit>=1.35'
      - name: Run offline non-lookahead regression checks
        run: python -m unittest discover -s tests -p 'test_minervini_5to8_forward.py' -v
      - name: Run 5-8 condition monthly forward comparison
        run: python scripts/backtest_minervini_5to8_forward.py --per-market 180 --workers 6 --output minervini_5to8_forward_result.json
      - name: Save auditable output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minervini-5to8-3m-6m-forward-study
          path: minervini_5to8_forward_result.json
          if-no-files-found: ignore
          retention-days: 21
