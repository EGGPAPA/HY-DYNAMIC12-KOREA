name: RSI MACD overlay on HY Minervini proxy pilot

on:
  push:
    branches:
      - experiment/minervini-hy-rsi-macd-pilot
    paths:
      - .github/workflows/minervini-hy-rsi-macd-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal analysis dependencies
        run: python -m pip install 'pandas>=2.0'
      - name: Test indicator logic and no lookahead
        run: python -m unittest discover -s tests -p 'test_minervini_hy_rsi_macd.py' -v
      - name: Reevaluate five previously verified trades with RSI and MACD
        run: python scripts/compare_minervini_hy_rsi_macd.py --output rsi_macd_pilot.json
      - name: Keep audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minervini-hy-rsi-macd-pilot
          path: rsi_macd_pilot.json
          if-no-files-found: ignore
          retention-days: 14
